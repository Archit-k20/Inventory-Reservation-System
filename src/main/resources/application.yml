spring:
  application:
    name: inventory-system
  datasource:
    url: jdbc:postgresql://localhost:5433/inventory_db
    username: postgres
    password: postgres
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: inventory-system
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.archit.inventory.event
        spring.json.value.default.type: com.archit.inventory.event.OrderFailedEvent
    listener:
      missing-topics-fatal: false

server:
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
      cors:
        allowed-origins: "http://localhost:5173,http://127.0.0.1:5173"
        allowed-methods: "GET,OPTIONS"
        allowed-headers: "*"
  endpoint:
    health:
      show-details: always

inventory:
  reservations:
    ttl: PT15M
    expiry-batch-size: 100
    expiry-rate-ms: 30000

springdoc:
  swagger-ui:
    path: /swagger-ui.html

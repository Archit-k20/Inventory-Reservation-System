spring:
  application:
    name: inventory-system
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/inventory_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms
  task:
    scheduling:
      pool:
        size: 2
  cache:
    type: redis
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 2000
        request.timeout.ms: 2000
        delivery.timeout.ms: 5000
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: inventory-system
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.archit.inventory.event
        spring.json.value.default.type: com.archit.inventory.event.OrderFailedEvent
    listener:
      missing-topics-fatal: false

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
      cors:
        allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
        allowed-methods: "GET,OPTIONS"
        allowed-headers: "*"
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:never}

inventory:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  outbox:
    poll-ms: 1000
    batch-size: 25
    ack-timeout: PT6S
  reservations:
    ttl: PT15M
    expiry-batch-size: 100
    expiry-rate-ms: 30000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
